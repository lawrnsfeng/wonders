<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Globe">
  <!-- It's a Wonderful World, matching the globe on its own switcher
       button — and deliberately the *same shape the app draws*: this is the
       U+1F30D 🌍 glyph lifted straight out of NotoEmoji-Regular, which is the font
       egui resolves that emoji to, so the browser tab and the in-app switcher
       button cannot drift apart. Drawing one by hand is what made the first
       attempt wrong.

       Regenerate with fontTools if the bundled font ever changes:
         glyph U+1F30D of epaint_default_fonts' NotoEmoji-Regular.ttf,
         outline via
         SVGPathPen, flipped (font Y is up, SVG Y is down) and centred in this
         64-unit box with a 3-unit margin.

       NotoEmoji is SIL Open Font License 1.1; the OFL does not restrict
       artwork produced from a font, and the provenance is recorded here
       rather than left to be rediscovered.

       Transparent ground on purpose: a favicon sits on whatever chrome the
       browser has, and a painted tile behind it reads as a box. One flat
       colour, because the glyph is monochrome and a tab is read at 16px. -->
